<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="index,follow">
    <title>{{ title }} — Nordiel</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/script.js" defer></script>
</head>
<body>
    <button id="theme-toggle" aria-label="Toggle theme" onclick="toggleTheme()">
        <svg id="icon-moon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z" />
        </svg>
        <svg id="icon-sun" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="display:none">
            <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
    </button>

    <main>
        <div class="post-header">
            <a href="/" class="back-link">← back</a>
            <h1>{{ title }}</h1>
            {% if date %}<time>{{ date | date: "%B %d, %Y" }}</time>{% endif %}
        </div>
        <article class="post-content">
            {{ content }}
        </article>
    </main>
</body>
</html>
