<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="index,follow">
    <title>{{ title }} — Nordiel</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/script.js" defer></script>
</head>
<body>
    <button id="theme-toggle" aria-label="Toggle theme" onclick="toggleTheme()">
        <svg id="icon-moon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z" />
        </svg>
        <svg id="icon-sun" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="display:none">
            <path d="M12 18a6 6 0 1 1 0-12 6 6 0 0 1 0 12zm0-2a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM11 1h2v3h-2V1zm0 19h2v3h-2v-3zM3.515 4.929l1.414-1.414L7.05 5.636 5.636 7.05 3.515 4.93zM16.95 18.364l1.414-1.414 2.121 2.121-1.414 1.414-2.121-2.121zm2.121-14.85l1.414 1.415-2.121 2.121-1.414-1.414 2.121-2.121zM5.636 16.95l1.414 1.414-2.121 2.121-1.414-1.414 2.121-2.121zM23 11v2h-3v-2h3zM4 11v2H1v-2h3z" />
        </svg>
    </button>

    <main>
        <div class="post-header">
            <a href="/" class="back-link">← back</a>
            <h1>{{ title }}</h1>
            {% if date %}<time>{{ date | date: "%B %d, %Y" }}</time>{% endif %}
        </div>
        <article class="post-content">
            {{ content }}
        </article>
    </main>
</body>
</html>
